<mat-sidenav-container class="shell">
  <mat-sidenav
    class="drawer"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="isHandset() ? drawerOpen() && isHandset() : drawerOpen()"
    (closedStart)="drawerOpen.set(false)"
  >
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <mat-icon>notifications_active</mat-icon>
      </div>
      <div class="brand-text">
        <strong>Notify</strong>
        <span class="text-muted">Rule engine</span>
      </div>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active"
          #link="routerLinkActive"
          [activated]="link.isActive"
          (click)="closeOnHandset()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
          @if (item.path === '/inbox' && notifications.unreadCount() > 0) {
            <span matListItemMeta class="count">{{ notifications.unreadCount() }}</span>
          }
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <button matIconButton (click)="toggleDrawer()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      <button
        matIconButton
        [matTooltip]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="theme.toggle()"
      >
        <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <a
        matIconButton
        routerLink="/inbox"
        matTooltip="Inbox"
        [matBadge]="notifications.unreadCount()"
        [matBadgeHidden]="notifications.unreadCount() === 0"
        matBadgeColor="warn"
        matBadgeSize="small"
        aria-label="Open inbox"
      >
        <mat-icon>notifications</mat-icon>
      </a>

      <button matButton [matMenuTriggerFor]="accountMenu" class="account">
        <span class="avatar" aria-hidden="true">{{ auth.initials() }}</span>
        <span class="account-name">{{ auth.user()?.name }}</span>
      </button>

      <mat-menu #accountMenu="matMenu">
        <div class="menu-header">
          <strong>{{ auth.user()?.name }}</strong>
          <span class="text-muted">{{ auth.user()?.email }}</span>
        </div>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
