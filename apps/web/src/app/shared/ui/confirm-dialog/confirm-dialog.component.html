<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="dialogRef.close(false)">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button
    matButton="filled"
    cdkFocusInitial
    [color]="data.destructive ? 'warn' : 'primary'"
    (click)="dialogRef.close(true)"
  >
    {{ data.confirmLabel ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
