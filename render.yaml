# Render blueprint. From the dashboard: New > Blueprint, point it at this repo.
#
# One service. The Express process serves the API and the built Angular client,
# so the whole system is a single deployable on a single origin: no CORS, no
# rewrite rules, and no API URL compiled into the bundle.
#
# To split them later, set SERVE_WEB=false here and add a static site publishing
# apps/web/dist/web/browser with a rewrite from /api/* to this service.
services:
  - type: web
    name: cns
    runtime: node
    plan: free
    region: singapore
    branch: main
    # --include=dev is required: NODE_ENV=production would otherwise make npm
    # skip devDependencies, and the build needs TypeScript and the Angular CLI.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w @cns/shared &&
      npm run build -w @cns/api &&
      npm run build -w @cns/web
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Set this in the dashboard to a MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_ROUNDS
        value: '12'
      # The client is served from this process, so requests are same-origin and
      # CORS only matters for direct API calls from elsewhere.
      - key: CORS_ORIGINS
        value: http://localhost:4200
      - key: SERVE_WEB
        value: 'true'
      - key: WORKER_ENABLED
        value: 'true'
      - key: WORKER_ID
        value: render-1
      - key: DELIVERY_MAX_ATTEMPTS
        value: '4'
      - key: MOCK_EMAIL_FAILURE_RATE
        value: '0'
